name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev ninja-build

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME=ON -DBUILD_BUILDER=ON -DBUILD_TESTS=ON

    - name: Build
      run: |
        cmake --build build --config Release -j $(nproc)

    - name: Run Tests
      run: |
        ctest --test-dir build --output-on-failure

    - name: Package Artifacts
      run: |
        mkdir -p package/bin
        cp build/btd4_game package/bin/
        cp build/btd4_builder package/bin/
        tar -czf btd4-linux-x86_64.tar.gz -C package bin

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: btd4-linux-x86_64
        path: btd4-linux-x86_64.tar.gz
