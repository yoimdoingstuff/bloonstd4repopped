name: Build Linux

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxfixes-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libgbm-dev ninja-build

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME=ON -DBUILD_BUILDER=ON -DBUILD_TESTS=ON

    - name: Build
      run: |
        cmake --build build --config Release -j $(nproc)

    - name: Run Tests
      env:
        SDL_VIDEO_DRIVER: dummy
        SDL_AUDIO_DRIVER: dummy
      run: |
        ctest --test-dir build --output-on-failure --timeout 60 --verbose

    - name: Package Artifacts
      run: |
        set -euo pipefail
        mkdir -p package/bin/assets/placeholder/rounds package/bin/assets/placeholder/upgrades package/bin/assets/placeholder/towers package/bin/lib

        cp build/btd4_game package/bin/
        cp build/btd4_builder package/bin/
        cp build/btd4_importer package/bin/

        # SDL3, SDL3_image, and SDL3_mixer are fetched and built by this project.
        while IFS= read -r lib; do
          cp -L "$lib" package/bin/lib/
        done < <(find build -type f -name 'libSDL3*.so*' -print)

        cat > package/bin/run-btd4-game.sh <<'EOF'
        #!/usr/bin/env bash
        set -e
        DIR="$(cd "$(dirname "$0")" && pwd)"
        export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec "$DIR/btd4_game" "$@"
        EOF
        chmod +x package/bin/run-btd4-game.sh

        cat > package/bin/run-btd4-builder.sh <<'EOF'
        #!/usr/bin/env bash
        set -e
        DIR="$(cd "$(dirname "$0")" && pwd)"
        export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec "$DIR/btd4_builder" "$@"
        EOF
        chmod +x package/bin/run-btd4-builder.sh

        cp assets/placeholder/rounds/default_rounds.json package/bin/assets/placeholder/rounds/default_rounds.json
        cp assets/placeholder/upgrades/default_upgrades.json package/bin/assets/placeholder/upgrades/default_upgrades.json
        cp assets/placeholder/towers/default_towers.json package/bin/assets/placeholder/towers/default_towers.json

        test -x package/bin/btd4_game
        test -x package/bin/btd4_builder
        test -x package/bin/btd4_importer
        test -x package/bin/run-btd4-game.sh
        test -x package/bin/run-btd4-builder.sh
        test -n "$(find package/bin/lib -maxdepth 1 -type f -name 'libSDL3*.so*' -print -quit)"
        test -n "$(find package/bin/lib -maxdepth 1 -type f -name 'libSDL3_mixer*.so* -print -quit)"

        tar -czf btd4-linux-x86_64.tar.gz -C package bin

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v6
      with:
        name: btd4-linux-x86_64
        path: btd4-linux-x86_64.tar.gz
        if-no-files-found: error
