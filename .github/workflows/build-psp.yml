name: Build PSP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

jobs:
  build-psp:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify toolchain dependencies
      run: |
        psp-gcc --version
        cmake --version
        test -f "$PSPDEV/psp/share/pspdev.cmake"
        test -x "$PSPDEV/bin/pack-pbp"
        test -x "$PSPDEV/bin/psp-prxgen"

    - name: Configure CMake for PSP
      run: cmake --preset psp-release

    - name: Build PSP executable and EBOOT.PBP
      run: cmake --build build/psp-release --parallel

    - name: Test PSP package structure
      run: ctest --test-dir build/psp-release --output-on-failure --no-tests=error

    - name: Package EBOOT.PBP
      run: |
        mkdir -p package/PSP/GAME/BTD4REPOPPED
        cp build/psp-release/EBOOT.PBP package/PSP/GAME/BTD4REPOPPED/EBOOT.PBP
        tar -czf btd4-psp.tar.gz -C package PSP

    - name: Upload PSP artifact
      uses: actions/upload-artifact@v4
      with:
        name: btd4-psp
        path: btd4-psp.tar.gz
        if-no-files-found: error
