name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME=ON -DBUILD_BUILDER=ON -DBUILD_TESTS=ON

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Run Tests
      run: |
        ctest --test-dir build -C Release --output-on-failure --timeout 60 --verbose

    - name: Package Artifacts
      shell: bash
      run: |
        mkdir -p package/bin
        cp build/Release/btd4_game.exe package/bin/ || cp build/btd4_game.exe package/bin/
        cp build/Release/btd4_builder.exe package/bin/ || cp build/btd4_builder.exe package/bin/
        cp build/Release/*.dll package/bin/ 2>/dev/null || true
        7z a btd4-windows-x64.zip ./package/bin/*

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: btd4-windows-x64
        path: btd4-windows-x64.zip
