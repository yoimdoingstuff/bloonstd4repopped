name: Build Windows

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME=ON -DBUILD_BUILDER=ON -DBUILD_TESTS=ON

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Run Tests
      run: |
        ctest --test-dir build -C Release --output-on-failure --timeout 60 --verbose

    - name: Package Artifacts
      if: ${{ success() }}
      shell: bash
      run: |
        mkdir -p package/bin/assets/placeholder/rounds package/bin/assets/placeholder/upgrades package/bin/assets/placeholder/towers
        cp build/Release/btd4_game.exe package/bin/ || cp build/btd4_game.exe package/bin/
        cp build/Release/btd4_builder.exe package/bin/ || cp build/btd4_builder.exe package/bin/
        cp build/Release/btd4_importer.exe package/bin/ || cp build/btd4_importer.exe package/bin/
        find build -type f \( -iname 'SDL2.dll' -o -iname 'SDL2_image*.dll' -o -iname 'SDL2_mixer*.dll' \) -exec cp -f {} package/bin/ \; 2>/dev/null || true
        cp build/Release/*.dll package/bin/ 2>/dev/null || true
        cp CMakeLists.txt package/bin/CMakeLists.txt
        cp assets/placeholder/rounds/default_rounds.json package/bin/assets/placeholder/rounds/default_rounds.json
        cp assets/placeholder/upgrades/default_upgrades.json package/bin/assets/placeholder/upgrades/default_upgrades.json
        cp assets/placeholder/towers/default_towers.json package/bin/assets/placeholder/towers/default_towers.json
        test -f package/bin/btd4_game.exe
        test -f package/bin/btd4_builder.exe
        test -f package/bin/btd4_importer.exe
        7z a btd4-windows-x64.zip ./package/bin/*

    - name: Upload Windows Artifact
      if: ${{ success() }}
      uses: actions/upload-artifact@v6
      with:
        name: btd4-windows-x64
        path: btd4-windows-x64.zip
        if-no-files-found: error
